<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPIB-Remote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='4' width='14' height='8' rx='2' fill='%232a78d6'/%3E%3Ccircle cx='5' cy='8' r='1.5' fill='white'/%3E%3Ccircle cx='11' cy='8' r='1.5' fill='white'/%3E%3C/svg%3E">

<header class="top">
